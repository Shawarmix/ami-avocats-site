<script type="text/babel" data-presets="react">
const useReveal = () => {
  const ref = React.useRef(null);
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    if (!ref.current) return;
    let cancelled = false;
    const reveal = () => { if (!cancelled) setVisible(true); };
    const safety = setTimeout(reveal, 400);
    const raf = requestAnimationFrame(() => {
      if (!ref.current || cancelled) return;
      const rect = ref.current.getBoundingClientRect();
      const vh = window.innerHeight || document.documentElement.clientHeight;
      if (rect.top < vh && rect.bottom > 0) reveal();
    });
    const io = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { reveal(); io.disconnect(); }
    }, { threshold: 0 });
    io.observe(ref.current);
    return () => { cancelled = true; clearTimeout(safety); cancelAnimationFrame(raf); io.disconnect(); };
  }, []);
  return [ref, visible];
};

const Reveal = ({ children, delay = 0, y = 24, as: Tag = 'div', style, ...rest }) => {
  const [ref, visible] = useReveal();
  return (
    <Tag ref={ref} style={{
      opacity: visible ? 1 : 0,
      transform: visible ? 'translateY(0)' : `translateY(${y}px)`,
      transition: `opacity 900ms cubic-bezier(.2,.7,.2,1) ${delay}ms, transform 900ms cubic-bezier(.2,.7,.2,1) ${delay}ms`,
      ...style,
    }} {...rest}>{children}</Tag>
  );
};

const PortraitPlaceholder = ({ theme, name, label = 'portrait' }) => (
  <div style={{
    aspectRatio: '3/4', width: '100%',
    background: `repeating-linear-gradient(135deg, ${theme.bgAlt}, ${theme.bgAlt} 8px, ${theme.card} 8px, ${theme.card} 16px)`,
    border: `1px solid ${theme.line}22`,
    position: 'relative', overflow: 'hidden',
    display: 'flex', alignItems: 'flex-end', justifyContent: 'flex-start',
  }}>
    <div style={{ position: 'absolute', top: 16, left: 16, fontFamily: theme.mono, fontSize: 10, letterSpacing: 2, color: theme.fgSoft, textTransform: 'uppercase' }}>[{label}]</div>
    <div style={{ padding: 20, width: '100%', background: `linear-gradient(180deg, transparent, ${theme.card}f0)`, fontFamily: theme.serif, fontSize: 22, color: theme.fg }}>{name}</div>
  </div>
);

const CustomCursor = ({ theme }) => {
  const dotRef   = React.useRef(null);
  const ringRef  = React.useRef(null);
  const posRef   = React.useRef({ x: -100, y: -100 });
  const ringPos  = React.useRef({ x: -100, y: -100 });

  React.useEffect(() => {
    const style = document.createElement('style');
    style.textContent = '* { cursor: none !important; }';
    document.head.appendChild(style);
    const onMove = e => { posRef.current = { x: e.clientX, y: e.clientY }; };
    const onEnter = e => {
      if (e.target.closest('a, button')) {
        if (dotRef.current)  { dotRef.current.style.width='14px'; dotRef.current.style.height='14px'; dotRef.current.style.marginLeft='-7px'; dotRef.current.style.marginTop='-7px'; }
        if (ringRef.current) { ringRef.current.style.width='56px'; ringRef.current.style.height='56px'; ringRef.current.style.marginLeft='-28px'; ringRef.current.style.marginTop='-28px'; }
      }
    };
    const onLeave = e => {
      if (e.target.closest('a, button')) {
        if (dotRef.current)  { dotRef.current.style.width='8px'; dotRef.current.style.height='8px'; dotRef.current.style.marginLeft='-4px'; dotRef.current.style.marginTop='-4px'; }
        if (ringRef.current) { ringRef.current.style.width='32px'; ringRef.current.style.height='32px'; ringRef.current.style.marginLeft='-16px'; ringRef.current.style.marginTop='-16px'; }
      }
    };
    document.addEventListener('mousemove', onMove, { passive: true });
    document.addEventListener('mouseover', onEnter, { passive: true });
    document.addEventListener('mouseout',  onLeave, { passive: true });
    let raf;
    const tick = () => {
      const { x, y } = posRef.current;
      if (dotRef.current) { dotRef.current.style.left = x+'px'; dotRef.current.style.top = y+'px'; }
      ringPos.current.x += (x - ringPos.current.x) * 0.12;
      ringPos.current.y += (y - ringPos.current.y) * 0.12;
      if (ringRef.current) { ringRef.current.style.left = ringPos.current.x+'px'; ringRef.current.style.top = ringPos.current.y+'px'; }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => {
      document.head.removeChild(style);
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseover', onEnter);
      document.removeEventListener('mouseout',  onLeave);
      cancelAnimationFrame(raf);
    };
  }, [theme.accent]);

  return (
    <>
      <div ref={dotRef} style={{ position:'fixed', zIndex:9997, pointerEvents:'none', width:6, height:6, marginLeft:-3, marginTop:-3, background:theme.accent, borderRadius:'50%', transition:'width 250ms, height 250ms, margin 250ms' }} />
      <div ref={ringRef} style={{ position:'fixed', zIndex:9996, pointerEvents:'none', width:18, height:18, marginLeft:-9, marginTop:-9, border:`1px solid ${theme.accent}55`, borderRadius:'50%', transition:'width 250ms, height 250ms, margin 250ms' }} />
    </>
  );
};

const ScrollProgress = ({ theme }) => {
  const [pct, setPct] = React.useState(0);
  React.useEffect(() => {
    const onScroll = () => {
      const total = document.body.scrollHeight - window.innerHeight;
      setPct(total > 0 ? (window.scrollY / total) * 100 : 0);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return <div style={{ position:'fixed', top:0, left:0, zIndex:48, height:2, background:theme.accent, width:`${pct}%`, transition:'width 80ms linear', pointerEvents:'none' }} />;
};

const SectionDots = ({ theme }) => {
  const sections = [
    { id:'top', label:'Accueil' }, { id:'expertises', label:'Expertises' },
    { id:'apropos', label:'À propos' }, { id:'equipe', label:'Équipe' },
    { id:'articles', label:'Articles' }, { id:'contact', label:'Contact' },
  ];
  const [active, setActive] = React.useState(0);
  React.useEffect(() => {
    const observers = sections.map(({ id }, i) => {
      const el = document.getElementById(id);
      if (!el) return null;
      const io = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) setActive(i); }, { threshold: 0.3 });
      io.observe(el);
      return io;
    });
    return () => observers.forEach(io => io && io.disconnect());
  }, []);
  return (
    <div style={{ position:'fixed', left:20, top:'50%', transform:'translateY(-50%)', zIndex:30, display:'flex', flexDirection:'column', gap:10 }}>
      {sections.map(({ id, label }, i) => (
        <a key={id} href={`#${id}`} title={label} style={{ textDecoration:'none' }}>
          <div style={{ width:6, height:6, borderRadius:'50%', border:`1px solid ${theme.fgSoft}`, background: active===i ? theme.accent : 'transparent', transform: active===i ? 'scale(1.4)' : 'scale(1)', transition:'background 300ms, transform 300ms, border-color 300ms', borderColor: active===i ? theme.accent : theme.fgSoft }} />
        </a>
      ))}
    </div>
  );
};

window.Reveal = Reveal;
window.useReveal = useReveal;
window.PortraitPlaceholder = PortraitPlaceholder;
window.CustomCursor = CustomCursor;
window.ScrollProgress = ScrollProgress;
window.SectionDots = SectionDots;
</script>

<!-- ── Hero & Nav ─────────────────────────────────────────────────────────────── -->
<script type="text/babel" data-presets="react">

const Nav = ({ theme, logo }) => {
  const [scrolled, setScrolled] = React.useState(false);
  const [menuOpen, setMenuOpen] = React.useState(false);
  React.useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 30);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  React.useEffect(() => {
    document.body.style.overflow = menuOpen ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [menuOpen]);
  const navLinks = ['À propos', 'Expertises', 'Équipe', 'Articles', 'Contact'];
  return (
    <>
      <header style={{ position:'fixed', top:0, left:0, right:0, zIndex:50, padding:scrolled?'14px 48px':'24px 48px', display:'flex', alignItems:'center', justifyContent:'space-between', background:'transparent', borderBottom:'1px solid transparent', transition:'padding 400ms cubic-bezier(.2,.7,.2,1)' }}>
        <a href="#top" style={{ textDecoration:'none', display:'flex', alignItems:'center' }}>{logo.compact({ theme, size: 0.75 })}</a>
        <button onClick={() => setMenuOpen(o => !o)} aria-label={menuOpen?'Fermer':'Ouvrir'} style={{ background:'transparent', border:'none', cursor:'pointer', padding:8, display:'flex', flexDirection:'column', gap:5, alignItems:'flex-end', zIndex:51 }}>
          <span style={{ display:'block', height:'1.2px', width:22, background:theme.fg, transform:menuOpen?'translateY(6.2px) rotate(45deg)':'none', transition:'transform 300ms cubic-bezier(.4,0,.2,1)' }} />
          <span style={{ display:'block', height:'1.2px', width:16, background:theme.fg, opacity:menuOpen?0:1, transition:'opacity 200ms' }} />
          <span style={{ display:'block', height:'1.2px', width:22, background:theme.fg, transform:menuOpen?'translateY(-6.2px) rotate(-45deg)':'none', transition:'transform 300ms cubic-bezier(.4,0,.2,1)' }} />
        </button>
      </header>
      <div style={{ position:'fixed', inset:0, zIndex:49, background:theme.bg, opacity:menuOpen?1:0, pointerEvents:menuOpen?'all':'none', transition:'opacity 400ms cubic-bezier(.4,0,.2,1)', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }}>
        <nav style={{ textAlign:'center' }}>
          {navLinks.map((item, i) => (
            <div key={item} style={{ opacity:menuOpen?1:0, transform:menuOpen?'translateY(0)':'translateY(24px)', transition:`opacity 400ms ${80+i*60}ms, transform 400ms ${80+i*60}ms` }}>
              <a href={`#${item.toLowerCase().replace(/[^a-z]/g,'')}`} onClick={() => setMenuOpen(false)} style={{ display:'block', fontFamily:theme.serif, fontSize:'clamp(36px,6vw,72px)', color:theme.fg, textDecoration:'none', lineHeight:1.25, padding:'6px 0', transition:'color 200ms, font-style 200ms' }}
                onMouseEnter={e => { e.currentTarget.style.color=theme.accent; e.currentTarget.style.fontStyle='italic'; }}
                onMouseLeave={e => { e.currentTarget.style.color=theme.fg; e.currentTarget.style.fontStyle='normal'; }}>{item}</a>
            </div>
          ))}
        </nav>
        <div style={{ position:'absolute', bottom:40, fontFamily:theme.mono, fontSize:10, letterSpacing:2, color:theme.fgSoft, textTransform:'uppercase', opacity:menuOpen?1:0, transition:'opacity 400ms 380ms' }}>contact@ami-avocats.fr <span style={{ color:theme.accent }}>·</span> Paris 8ᵉ</div>
      </div>
    </>
  );
};

const EditorialHero = ({ theme }) => {
  const [parallaxY, setParallaxY] = React.useState(0);
  React.useEffect(() => {
    let raf;
    const onScroll = () => { raf = requestAnimationFrame(() => { setParallaxY(Math.min(Math.max(window.scrollY * 0.18, -60), 60)); }); };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => { window.removeEventListener('scroll', onScroll); cancelAnimationFrame(raf); };
  }, []);
  return (
    <section id="top" style={{ minHeight:'100vh', color:theme.fg, padding:'clamp(60px,10vh,120px) clamp(20px,5vw,48px) 40px', position:'relative', overflow:'hidden', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }}>
      <div style={{ position:'relative', zIndex:2, textAlign:'center' }}>
        <Reveal delay={180}>

const useCountUp = (target, duration=1800) => {
  const [count, setCount] = React.useState(0);
  const ref = React.useRef(null);
  React.useEffect(() => {
    const io = new IntersectionObserver(([entry]) => {
      if (!entry.isIntersecting) return;
      io.disconnect();
      const start = performance.now();
      const ease = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
      const tick = now => { const e = Math.min((now-start)/duration,1); setCount(Math.round(ease(e)*target)); if (e<1) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    }, { threshold:0.3 });
    if (ref.current) io.observe(ref.current);
    return () => io.disconnect();
  }, [target, duration]);
  return [ref, count];
};

const InkCanvas = ({ sceneIdx, bg }) => {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const DPR = window.devicePixelRatio || 1;
    const W = 360 * DPR, H = 460 * DPR;
    canvas.width = W; canvas.height = H;
    const s = Math.min(W, H) / 800;
    const cx = W/2, cy = H/2;
    let rafId, lastFrame = 0, p = 0, dissolve = 0, dissolving = false;
    const FPS = 12, FRAME_DUR = 1000/FPS, SCENE_DUR = 140;
    const ic  = a => `rgba(148,118,168,${a.toFixed(3)})`;
    const ic2 = a => `rgba(185,150,205,${a.toFixed(3)})`;

    function bLine(x0,y0,x1,y1,mw,al,wob=3) {
      const n = Math.max(8, Math.round(Math.hypot(x1-x0,y1-y0)/8));
      for(let i=0;i<n;i++){
        const t0=i/n,t1=(i+1)/n,tap=Math.sin((t0+t1)/2*Math.PI);
        ctx.save();ctx.strokeStyle=ic(al*tap);ctx.lineWidth=mw*tap;ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(x0+(x1-x0)*t0+Math.sin(t0*17)*wob,y0+(y1-y0)*t0+Math.cos(t0*13)*wob*.5);
        ctx.lineTo(x0+(x1-x0)*t1+Math.sin(t1*17)*wob,y0+(y1-y0)*t1+Math.cos(t1*13)*wob*.5);
        ctx.stroke();ctx.restore();
      }
    }
    function bCurve(x0,y0,cpx,cpy,x1,y1,mw,al) {
      const B=(t,a,b,c)=>(1-t)**2*a+2*(1-t)*t*b+t*t*c;
      for(let i=0;i<24;i++){
        const t0=i/24,t1=(i+1)/24,tap=Math.sin((t0+t1)/2*Math.PI);
        ctx.save();ctx.strokeStyle=ic(al*tap);ctx.lineWidth=mw*tap;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(B(t0,x0,cpx,x1),B(t0,y0,cpy,y1));ctx.lineTo(B(t1,x0,cpx,x1),B(t1,y0,cpy,y1));
        ctx.stroke();ctx.restore();
      }
    }
    function blot(bx,by,r,al) {
      ctx.save();
      for(let i=0;i<3;i++){
        ctx.beginPath();
        for(let j=0;j<=14;j++){const ang=(j/14)*Math.PI*2,jit=r*(.6+Math.random()*.7);j?ctx.lineTo(bx+Math.cos(ang)*jit,by+Math.sin(ang)*jit*(.7+Math.random()*.4)):ctx.moveTo(bx+Math.cos(ang)*jit,by+Math.sin(ang)*jit*(.7+Math.random()*.4));}
        ctx.closePath();ctx.fillStyle=ic(al*(.3-i*.08));ctx.fill();
      }
      ctx.restore();
    }

    function drawBuilding(p) {
      const h=280*s,w=160*s,floors=7,fH=h/floors,vp=Math.min(1,p*2.5);
      bLine(cx-w/2,cy+h/2,cx-w/2,cy+h/2-h*vp,3*s,.7);bLine(cx+w/2,cy+h/2,cx+w/2,cy+h/2-h*vp,3*s,.7);bLine(cx,cy+h/2,cx,cy+h/2-h*vp,2*s,.4);
      const fp=Math.max(0,(p-.3)*2),vF=Math.floor(fp*floors);
      for(let i=0;i<=vF;i++){const fy=cy+h/2-i*fH,pw=i<vF?w:w*(fp*floors-vF);bLine(cx-w/2,fy,cx-w/2+pw,fy,2*s,.55);}
      const wp=Math.max(0,(p-.55)*3),wC=3,wR=floors-1,ww=(w*.55)/wC,wh=fH*.45,wx0=cx-w*.25,wy0=cy+h/2-fH;
      for(let r=0;r<wR;r++) for(let c=0;c<wC;c++){if((r*wC+c)/(wR*wC)>wp)continue;ctx.save();ctx.strokeStyle=ic2(.55);ctx.lineWidth=1.2*s;ctx.strokeRect(wx0+c*(ww+ww*.3)-w*.1,wy0-r*fH-wh,ww,wh);ctx.restore();}
    }
    function drawHandshake(p) {
      const p1=Math.min(1,p*2.2),p2=Math.min(1,Math.max(0,p*2.2-.3));
      bLine(cx-220*s,cy+60*s,cx-20*s,cy,18*s,.55*p1,4);bLine(cx+220*s,cy+60*s,cx+20*s,cy,18*s,.55*p2,4);
      if(p>.45){const hp=Math.min(1,(p-.45)*4);ctx.save();ctx.strokeStyle=ic(.65*hp);ctx.lineWidth=12*s;ctx.lineCap='round';ctx.beginPath();ctx.arc(cx,cy+10*s,22*s,-Math.PI*.3,Math.PI*.3);ctx.stroke();ctx.beginPath();ctx.arc(cx,cy-10*s,22*s,Math.PI*.7,Math.PI*1.3);ctx.stroke();ctx.restore();for(let i=0;i<5;i++){const a=(i/5)*Math.PI*2;blot(cx+Math.cos(a)*(30+i*12)*s,cy+Math.sin(a)*(30+i*12)*s,(3+i)*s*.5,.15*hp);}}
    }
    function drawGavel(p) {
      const p1=Math.min(1,p*2);bLine(cx-80*s,cy+60*s,cx-80*s+(160*s)*p1,cy+60*s-(120*s)*p1,9*s,.7,3);
      if(p>.4){const hp=Math.min(1,(p-.4)*3),hx=cx+30*s,hy=cy-30*s,hw=70*s,hh=28*s;ctx.save();ctx.strokeStyle=ic(.7*hp);ctx.lineWidth=4*s;ctx.lineCap='round';ctx.strokeRect(hx-hw/2,hy-hh/2,hw*hp,hh);ctx.restore();bLine(hx-hw/2,hy-hh/2,hx-hw/2,hy+hh/2,4*s,.7*hp);}
      if(p>.65){const sp=Math.min(1,(p-.65)*4);bLine(cx-80*s,cy+90*s,cx+80*s,cy+90*s,6*s,.6*sp,2);bLine(cx-65*s,cy+90*s,cx-65*s,cy+110*s,4*s,.5*sp);bLine(cx+65*s,cy+90*s,cx+65*s,cy+110*s,4*s,.5*sp);bLine(cx-65*s,cy+110*s,cx+65*s,cy+110*s,4*s,.5*sp);}
    }
    function drawQuill(p) {
      const qp=Math.min(1,p*1.8);bLine(cx+80*s,cy-120*s,cx-40*s,cy+80*s,2.5*s,.75*qp,2);
      if(qp>.2) for(let i=0;i<8;i++){const t=i/8;if(t>qp-.2)continue;const bx=cx+80*s-(120*s)*t,by=cy-120*s+(200*s)*t;bCurve(bx,by,bx-25*s,by-15*s,bx-40*s,by-8*s,1.8*s,.45);bCurve(bx,by,bx+20*s,by-12*s,bx+32*s,by-4*s,1.8*s,.45);}
      const lp=Math.max(0,(p-.35)*2.2),lx=cx-140*s,lS=cy-20*s;
      for(let i=0;i<5;i++){const lpr=Math.min(1,Math.max(0,lp-i*.18));bLine(lx,lS+i*28*s,lx+(170-i*10)*s*lpr,lS+i*28*s,1.5*s,.45,1.5);}
    }
    function drawScales(p) {
      const pp=Math.min(1,p*2);bLine(cx,cy+100*s,cx,cy-80*s*pp,4*s,.7,2);
      if(p>.3){const bp=Math.min(1,(p-.3)*3);bLine(cx-130*s*bp,cy-80*s,cx+130*s*bp,cy-80*s,3*s,.65,2);}
      if(p>.55){const cp=Math.min(1,(p-.55)*3),sw=Math.sin(p*Math.PI*4)*12*s,lx=cx-130*s,rx=cx+130*s,ch=55*s;
        bLine(lx,cy-80*s,lx+sw*.3,cy-80*s+ch*cp,1.5*s,.55);if(cp>.5)bLine(lx-40*s+sw*.5,cy-80*s+ch,lx+40*s+sw*.5,cy-80*s+ch,3*s,.6*cp,1.5);
        bLine(rx,cy-80*s,rx-sw*.3,cy-80*s+ch*cp,1.5*s,.55);if(cp>.5)bLine(rx-40*s-sw*.5,cy-80*s+ch,rx+40*s-sw*.5,cy-80*s+ch,3*s,.6*cp,1.5);}
      if(p>.75){const fp=Math.min(1,(p-.75)*4);bLine(cx-60*s,cy+100*s,cx+60*s,cy+100*s,4*s,.6*fp,2);}
    }
    function drawSkyline(p) {
      const blds=[{x:-220,w:45,h:140},{x:-165,w:38,h:200},{x:-118,w:52,h:160},{x:-56,w:40,h:240},{x:-8,w:55,h:180},{x:56,w:42,h:220},{x:108,w:50,h:155},{x:168,w:38,h:185}];
      const skyP=Math.min(1,p*1.8);
      blds.forEach((b,idx)=>{const bp=Math.min(1,Math.max(0,skyP-idx*.08)),bx=cx+b.x*s,by=cy+80*s,bh=b.h*s*bp;ctx.save();ctx.strokeStyle=ic(.65);ctx.lineWidth=2*s;ctx.strokeRect(bx*.85+cx*.15-b.w*s/2,by-bh,b.w*s,bh);ctx.restore();});
      bLine(cx-260*s,cy+80*s,cx+260*s,cy+80*s,2.5*s,.52,2);
    }

    const SCENES=[drawBuilding,drawHandshake,drawGavel,drawQuill,drawScales,drawSkyline];
    const scene=sceneIdx%SCENES.length;

    function render(now) {
      rafId=requestAnimationFrame(render);
      if(now-lastFrame<FRAME_DUR)return;
      lastFrame=now;
      const adv=1/SCENE_DUR;
      if(!dissolving){p=Math.min(1,p+adv);if(p>=1){dissolving=true;dissolve=0;}}
      else{dissolve=Math.min(1,dissolve+adv*1.2);if(dissolve>=1){p=0;dissolve=0;dissolving=false;}}
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle=bg||'#FAF6EE';ctx.fillRect(0,0,W,H);
      ctx.save();ctx.globalAlpha=dissolving?Math.max(0,1-dissolve*1.3):1;
      SCENES[scene](p);
      ctx.restore();
    }
    rafId=requestAnimationFrame(render);
    return ()=>cancelAnimationFrame(rafId);
  }, [sceneIdx,bg]);
  return <canvas ref={ref} style={{width:'100%',height:'100%',display:'block',position:'absolute',inset:0}} />;
};
